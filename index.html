<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="在地图模式、3D 银河与思想时间轴之间，探索心理学、哲学、系统论和神经科学人物的连接。"
    />
    <meta name="theme-color" content="#1a1713" />
    <link rel="canonical" href="https://xizili.github.io/relationship-galaxy/" />
    <meta property="og:title" content="关系的银河" />
    <meta
      property="og:description"
      content="一张可以探索、聚焦和核查的人物关系知识图谱。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xizili.github.io/relationship-galaxy/" />
    <meta property="og:image" content="https://xizili.github.io/relationship-galaxy/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="关系的银河" />
    <meta
      name="twitter:description"
      content="在地图模式、3D 银河与思想时间轴之间，探索人物、思想与具体连接。"
    />
    <meta name="twitter:image" content="https://xizili.github.io/relationship-galaxy/og.png" />
    <title>关系的银河 - 人物关系知识图谱</title>
  </head>
  <body>
    <main id="app" data-active-view="galaxy">
      <section id="topologyView" class="view-surface" aria-label="人物关系地图">
        <svg id="topologyGraph"></svg>
        <div class="topology-caption" aria-hidden="true">
          <span>策展布局</span>
          <strong>选择人物，沿连线阅读具体关系</strong>
        </div>
        <div id="relationLegend" class="relation-legend" aria-label="关系类型图例"></div>
      </section>

      <section id="scene" class="view-surface is-active" aria-label="3D 人物关系银河"></section>
      <p id="galaxyHint" class="galaxy-hint">滚动或双指缩放，拖动旋转关系星云。<br />点击人名旁的节点，探索人物与连接。</p>

      <section id="timelineView" class="view-surface timeline-view" aria-label="人物思想时间轴">
        <div class="timeline-shell">
          <div class="timeline-intro">
            <span>Chronology of ideas</span>
            <h2>思想关系的时间剖面</h2>
            <p>按出生年代观察人物如何跨越流派与代际。选择任一人物，可在右侧继续阅读其具体关系。</p>
            <div class="timeline-summary" aria-label="时间轴数据概览">
              <strong id="timelineVisibleCount">72</strong><span>位人物</span>
              <strong id="timelineYearRange">前384—1965</strong><span>出生年份跨度</span>
            </div>
          </div>
          <div id="timelineContent" class="timeline-content"></div>
        </div>
      </section>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>关系的银河</h1>
            <p>Atlas of minds & relations</p>
          </div>
        </div>

        <nav id="viewSwitcher" class="view-switcher" aria-label="视图切换">
          <button type="button" data-view="topology" aria-pressed="false">地图模式</button>
          <button type="button" class="active" data-view="galaxy" aria-pressed="true">银河模式</button>
          <button type="button" data-view="timeline" aria-pressed="false">时间轴</button>
        </nav>

        <div class="search-wrap">
          <i data-lucide="search" aria-hidden="true"></i>
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="搜索人物、关系、领域、流派"
            aria-label="搜索人物、关系、领域、流派"
          />
          <div id="searchResults" class="search-results" role="listbox"></div>
        </div>

        <nav id="groupFilters" class="segmented" aria-label="主要领域筛选" title="左右滑动可查看全部领域"></nav>

        <div class="view-actions">
          <button
            id="overviewToggle"
            class="icon-button"
            type="button"
            aria-label="远望关系星云并打开介绍"
            aria-controls="detailPanel"
            aria-expanded="false"
            title="远望关系星云并打开介绍"
          >
            <i data-lucide="telescope" aria-hidden="true"></i>
          </button>
          <button id="orbitToggle" class="icon-button active" type="button" aria-pressed="true" aria-label="停止自动旋转" title="停止自动旋转">
            <i data-lucide="orbit" aria-hidden="true"></i>
          </button>
          <button id="resetView" class="icon-button" type="button" aria-label="重置当前视图" title="重置当前视图" hidden>
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          </button>
          <button id="sourceToggle" class="icon-button" type="button" aria-label="原始图谱" title="原始图谱">
            <i data-lucide="map" aria-hidden="true"></i>
          </button>
          <button id="imageCreditsToggle" class="icon-button image-credits-toggle" type="button" aria-label="图片来源与授权" title="图片来源与授权">©</button>
        </div>
      </header>

      <aside
        id="detailPanel"
        class="detail-panel is-collapsed"
        aria-live="polite"
        aria-label="人物与关系详情"
        aria-hidden="true"
        inert
      >
        <div class="detail-panel-toolbar">
          <button id="closeDetailPanel" class="detail-panel-close icon-button" type="button" aria-label="关闭侧边栏" title="关闭侧边栏">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
        <div id="detailPanelContent"></div>
      </aside>

      <div class="depth-control" aria-label="关系层级" hidden>
        <button type="button" data-depth="1" class="active">一度</button>
        <button type="button" data-depth="2">二度</button>
        <button type="button" data-depth="all">全部</button>
      </div>

      <section id="sourceMap" class="source-map" aria-label="原始图谱预览">
        <div class="source-map-head">
          <span>旧版图片预览 · 当前版以 XMind 文字为准</span>
          <button id="closeSourceMap" class="icon-button" type="button" aria-label="关闭原始图谱" title="关闭">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
        <p class="source-map-download"><a href="%BASE_URL%xmind-map.md" target="_blank" rel="noopener">阅读完整 XMind 节点与关系文字（Markdown）</a></p>
        <img src="/assets/freud-map-preview.webp" alt="早期提供的关系图图片；完整新节点与关系请阅读上方 XMind 文字对照" />
      </section>

      <div id="linkToast" class="link-toast" aria-live="polite"></div>
      <dialog id="imageCredits" class="image-credits" aria-labelledby="imageCreditsTitle">
        <form method="dialog"><button class="icon-button" aria-label="关闭图片授权">×</button></form>
        <h2 id="imageCreditsTitle">图片来源与授权</h2>
        <p>人物肖像的作者、来源与许可集中列于此处。</p>
        <div id="imageCreditsContent"></div>
      </dialog>
      <p id="viewStatus" class="sr-only" aria-live="polite"></p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
